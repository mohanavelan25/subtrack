# Works as a Dockhand Git stack. Set variables in the stack's environment section (see .env.example).
services:
  subtrack:
    image: ghcr.io/${GHCR_OWNER:-your-github-user}/${GHCR_REPO:-subtrack}:latest
    build: .            # used only if you run `docker compose up --build` on the host
    container_name: subtrack
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${PORT}:${PORT}"
    environment:
      PORT: ${PORT}
      DATA_DIR: /data
      TZ: ${TZ:-Asia/Kolkata}
      CURRENCY: ${CURRENCY:-INR}
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASS: ${AUTH_PASS:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_TYPE: ${WEBHOOK_TYPE:-generic}
      WEBHOOK_DAYS: ${WEBHOOK_DAYS:-3}
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data
