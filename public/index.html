<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>SubTrack</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>SubTrack</h1>
  <nav id="nav">
    <button data-v="dashboard">Dashboard</button>
    <button data-v="subs">Subscriptions</button>
    <button data-v="history">History</button>
    <button data-v="settings">Settings</button>
  </nav>
</header>
<main id="view"></main>
<div id="toast" role="status"></div>

<dialog id="editDlg">
  <form id="editForm">
    <h2 id="editTitle">Add subscription</h2>
    <input type="hidden" name="_id">
    <label>Name<input name="name" required></label>
    <div class="row">
      <label>Category<input name="category" list="cats" placeholder="Other"></label>
      <label>Amount<input name="amount" type="number" step="0.01" min="0" required></label>
    </div>
    <div class="row">
      <label>Billing cycle<select name="cycle"></select></label>
      <label id="intervalWrap" hidden>Every (days)<input name="interval_days" type="number" min="1"></label>
      <label>Next due date<input name="next_due_date" type="date" required></label>
    </div>
    <div class="row">
      <label>Payment method<input name="payment_method" placeholder="Card, UPI, bank account"></label>
      <label>Status<select name="status"><option>active</option><option>paused</option><option>cancelled</option></select></label>
    </div>
    <label>Website<input name="url" type="url" placeholder="https://"></label>
    <label>Notes<textarea name="notes" rows="2"></textarea></label>
    <label class="check"><input type="checkbox" name="auto_renew"> Renews automatically</label>
    <div class="actions"><button type="button" class="ghost" data-close>Cancel</button><button class="primary">Save subscription</button></div>
  </form>
  <datalist id="cats"></datalist>
</dialog>

<dialog id="payDlg">
  <form id="payForm">
    <h2 id="payTitle">Mark as paid</h2>
    <label>Subscription<select name="subscription_id" required></select></label>
    <div class="row">
      <label>Date paid<input name="date_paid" type="date" required></label>
      <label>Amount paid<input name="amount" type="number" step="0.01" min="0" required></label>
    </div>
    <label>Notes<input name="notes"></label>
    <p class="muted" id="payHint"></p>
    <div class="actions"><button type="button" class="ghost" data-close>Cancel</button><button class="primary" id="payBtn">Save payment</button></div>
  </form>
</dialog>
<input type="file" id="importFile" accept=".json,.csv" hidden>
<script src="app.js"></script>
</body>
</html>
